packages:
  - 'packages/*'
  - 'apps/*'

# esbuild (pulled in by vitest and tsx) runs a postinstall to fetch its platform
# binary. pnpm 11 fails the install with ERR_PNPM_IGNORED_BUILDS unless the
# build script is explicitly approved here. `onlyBuiltDependencies` is the
# pnpm 10 spelling and is ignored by pnpm 11.
allowBuilds:
  esbuild: true
